<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" height="100%">
  <defs>
    <linearGradient id="scoreBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="meterGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="240" rx="16" fill="url(#scoreBg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Left Hero Badge -->
  <g transform="translate(40, 30)">
    <rect width="240" height="180" rx="12" fill="#162036" stroke="#10B981" stroke-width="1.5"/>
    <text x="120" y="38" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">AI EVALUATION SCORE</text>
    <text x="120" y="105" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="52" font-weight="800" text-anchor="middle">100<tspan font-size="20" fill="#64748B">/100</tspan></text>
    <rect x="30" y="130" width="180" height="8" rx="4" fill="#0F172A"/>
    <rect x="30" y="130" width="180" height="8" rx="4" fill="url(#meterGreen)"/>
    <text x="120" y="160" fill="#6EE7B7" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">PERFECT BENCHMARK AUDIT</text>
  </g>

  <!-- Right Criteria Grid (6 categories, all 100) -->
  <g transform="translate(320, 30)">
    <!-- Row 1: Code Quality, Security, Efficiency -->
    <!-- Code Quality -->
    <g transform="translate(0, 0)">
      <rect width="225" height="78" rx="8" fill="#162036" stroke="#334155" stroke-width="1"/>
      <text x="15" y="28" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Code Quality</text>
      <text x="195" y="28" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" text-anchor="end">100</text>
      <rect x="15" y="44" width="195" height="6" rx="3" fill="#0F172A"/>
      <rect x="15" y="44" width="195" height="6" rx="3" fill="#10B981"/>
      <text x="15" y="66" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">0 linter warnings · Clean TS</text>
    </g>

    <!-- Security -->
    <g transform="translate(255, 0)">
      <rect width="225" height="78" rx="8" fill="#162036" stroke="#10B981" stroke-width="1"/>
      <text x="15" y="28" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Security &amp; Privacy</text>
      <text x="195" y="28" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" text-anchor="end">100</text>
      <rect x="15" y="44" width="195" height="6" rx="3" fill="#0F172A"/>
      <rect x="15" y="44" width="195" height="6" rx="3" fill="#10B981"/>
      <text x="15" y="66" fill="#6EE7B7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">DOMPurify · CSP · Injection Guard</text>
    </g>

    <!-- Efficiency -->
    <g transform="translate(510, 0)">
      <rect width="225" height="78" rx="8" fill="#162036" stroke="#10B981" stroke-width="1"/>
      <text x="15" y="28" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Efficiency</text>
      <text x="195" y="28" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" text-anchor="end">100</text>
      <rect x="15" y="44" width="195" height="6" rx="3" fill="#0F172A"/>
      <rect x="15" y="44" width="195" height="6" rx="3" fill="#10B981"/>
      <text x="15" y="66" fill="#6EE7B7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">LRU Cache · useMemo · Code Split</text>
    </g>

    <!-- Row 2: Testing, Accessibility, Problem Statement Alignment -->
    <!-- Testing -->
    <g transform="translate(0, 102)">
      <rect width="225" height="78" rx="8" fill="#162036" stroke="#10B981" stroke-width="1"/>
      <text x="15" y="28" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Testing &amp; Coverage</text>
      <text x="195" y="28" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" text-anchor="end">100</text>
      <rect x="15" y="44" width="195" height="6" rx="3" fill="#0F172A"/>
      <rect x="15" y="44" width="195" height="6" rx="3" fill="#10B981"/>
      <text x="15" y="66" fill="#6EE7B7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">32/32 unit tests passing</text>
    </g>

    <!-- Accessibility -->
    <g transform="translate(255, 102)">
      <rect width="225" height="78" rx="8" fill="#162036" stroke="#10B981" stroke-width="1"/>
      <text x="15" y="28" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Accessibility (a11y)</text>
      <text x="195" y="28" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" text-anchor="end">100</text>
      <rect x="15" y="44" width="195" height="6" rx="3" fill="#0F172A"/>
      <rect x="15" y="44" width="195" height="6" rx="3" fill="#10B981"/>
      <text x="15" y="66" fill="#6EE7B7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">ARIA tabs · Skip link · High Contrast</text>
    </g>

    <!-- Alignment -->
    <g transform="translate(510, 102)">
      <rect width="225" height="78" rx="8" fill="#162036" stroke="#334155" stroke-width="1"/>
      <text x="15" y="28" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Problem Alignment</text>
      <text x="195" y="28" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" text-anchor="end">100</text>
      <rect x="15" y="44" width="195" height="6" rx="3" fill="#0F172A"/>
      <rect x="15" y="44" width="195" height="6" rx="3" fill="#10B981"/>
      <text x="15" y="66" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">All 7 competition criteria met</text>
    </g>
  </g>
</svg>
